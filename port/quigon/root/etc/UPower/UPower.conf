# /etc/UPower/UPower.conf
# ASUS Chromebook CM14 (CM1406CM4A) - Dotation Île-de-France (20h battery configuration)

[UPower]
EnableWattsUpPro=false
NoPollBatteries=false
PollIntervalWatt=30
PollIntervalBattery=30
UsePercentageForPolicy=true
PercentageLow=10
PercentageCritical=5
PercentageAction=3
TimeLow=1800
TimeCritical=600
TimeAction=300
CriticalPowerAction=Suspend

