## Tarkin runs from a USB stick.
#
# A big pacman transaction (installing a desktop, or a full -Syu) leaves
# hundreds of megabytes of dirty pages in RAM. Flushing them to a USB stick
# can take longer than the hung-task timeout, and with kernel.hung_task_panic=1
# the watchdog turns that into "Kernel panic - not syncing: hung_task: blocked
# tasks" and reboots 10 seconds later (kernel.panic below), in the middle of
# the package transaction. The half-written rootfs then has no working
# cage/foot, and because the ChromeOS kernel has no text console the result is
# a black screen with no way in.
#
# Confirmed on a real CM1406: pacman blocked in ksys_sync -> wb_wait_for_completion
# for 122 s, panic, reboot. The stick was writing at ~4 MB/s, so ~475 MB of
# backlog could never drain in time.
#
# Never panic on a hung task here. If the stick is slow, be slow, not dead.
kernel.hung_task_panic = 0
kernel.hung_task_timeout_secs = 120

# Keep the backlog small enough for slow flash to drain it.
vm.dirty_background_bytes = 8388608
vm.dirty_bytes = 33554432

# Still reboot 10 s after a *real* kernel panic (undo with: sysctl kernel.panic=0).
kernel.panic = 10
