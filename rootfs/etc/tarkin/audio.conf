# Sound settings for the mt8189_rt5650 card (v1.50), read by tarkin-audio.service (user unit).
# After a change: systemctl --user restart tarkin-audio.service
#
# TARKIN_AUDIO_PROFILE
#   pro-audio  (default) PipeWire opens the PCMs directly; tarkin-audio switches the routes of the use case
#              profile (alsaucm) itself: speakers, or headphones when the headset jack reports them.
#   hifi       experimental: let PipeWire/WirePlumber use the UCM profile "HiFi" themselves. The profile has no
#              JackControl, so WirePlumber cannot switch to the headphones on its own; for tests only.
#   off        tarkin-audio does nothing (manual setup).
TARKIN_AUDIO_PROFILE=pro-audio
# Volume applied the first time a sink is seen (after that the last volume is kept), in percent of the
# PipeWire volume (same scale as wpctl and the volume keys). 100 is the full digital level.
TARKIN_SPEAKER_VOLUME=60
TARKIN_HEADPHONE_VOLUME=40
# 1: switch speakers <-> headphones and internal mic <-> headset mic when the jack changes.
TARKIN_JACK_SWITCH=1
