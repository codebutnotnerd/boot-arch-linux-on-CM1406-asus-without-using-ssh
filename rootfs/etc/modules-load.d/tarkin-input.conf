# Touchpad on Tarkin: ELAN I2C-HID, USB HID id 04F3:31C6.
#
# libinput only treats a device as a touchpad (taps, two-finger scroll,
# palm rejection) when hid-multitouch owns it. If only hid-generic binds it,
# the trackpad behaves like a clumsy absolute mouse. Make sure both layers
# are loaded; loading a built-in module is a harmless no-op.
i2c-hid
hid-multitouch
