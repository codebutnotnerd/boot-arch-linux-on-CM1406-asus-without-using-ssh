Section "InputClass"
    Identifier "tarkin touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "off"
    Option "DisableWhileTyping" "on"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "-0.2"
EndSection
